name: flowstock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${FLOWSTOCK_PG_BIND_HOST:-127.0.0.1}:5432:5432"
      - "${FLOWSTOCK_PG_SECOND_BIND_HOST:-${FLOWSTOCK_PG_BIND_HOST:-127.0.0.1}}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrator:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MIGRATIONS_DIR: /migrations
      POSTGRES_WAIT_TIMEOUT_SECONDS: ${POSTGRES_WAIT_TIMEOUT_SECONDS:-120}
    volumes:
      - ./postgres/migrations:/migrations:ro
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/run_migrations.sh"]
    restart: "no"

  flowstock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: flowstock-runtime
      args:
        FLOWSTOCK_DOTNET_SDK_IMAGE: ${FLOWSTOCK_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:8.0}
        FLOWSTOCK_DOTNET_ASPNET_IMAGE: ${FLOWSTOCK_DOTNET_ASPNET_IMAGE:-mcr.microsoft.com/dotnet/aspnet:8.0}
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080

      FLOWSTOCK_PG_HOST: postgres
      FLOWSTOCK_PG_PORT: 5432
      FLOWSTOCK_PG_DB: ${POSTGRES_DB}
      FLOWSTOCK_PG_USER: ${POSTGRES_USER}
      FLOWSTOCK_PG_PASSWORD: ${POSTGRES_PASSWORD}

      FLOWSTOCK_TSD_ROOT: /app/tsd
      FLOWSTOCK_PC_ROOT: /app/tsd/pc
      FLOWSTOCK_PUBLIC_BASE_URL: ${FLOWSTOCK_PUBLIC_BASE_URL:?FLOWSTOCK_PUBLIC_BASE_URL is required}
      FLOWSTOCK_INSTANCE_NAME: ${FLOWSTOCK_INSTANCE_NAME:?FLOWSTOCK_INSTANCE_NAME is required}
      FLOWSTOCK_TLS_SERVER_NAME: ${FLOWSTOCK_TLS_SERVER_NAME:?FLOWSTOCK_TLS_SERVER_NAME is required}
      FLOWSTOCK_TLS_SANS: ${FLOWSTOCK_TLS_SANS:-}
      FLOWSTOCK_DISCOVERY_BEHIND_RELAY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "${FLOWSTOCK_PORT:-8080}:8080"
      - "127.0.0.1:${FLOWSTOCK_DISCOVERY_BACKEND_PORT:-17155}:7155/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  discovery-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: discovery-relay-runtime
      args:
        FLOWSTOCK_DOTNET_SDK_IMAGE: ${FLOWSTOCK_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:8.0}
        FLOWSTOCK_DOTNET_ASPNET_IMAGE: ${FLOWSTOCK_DOTNET_ASPNET_IMAGE:-mcr.microsoft.com/dotnet/aspnet:8.0}
    environment:
      FLOWSTOCK_DISCOVERY_BACKEND_PORT: ${FLOWSTOCK_DISCOVERY_BACKEND_PORT:-17155}
      FLOWSTOCK_DISCOVERY_RELAY_TIMEOUT_MS: ${FLOWSTOCK_DISCOVERY_RELAY_TIMEOUT_MS:-2000}
      FLOWSTOCK_DISCOVERY_RELAY_MAX_IN_FLIGHT: ${FLOWSTOCK_DISCOVERY_RELAY_MAX_IN_FLIGHT:-64}
    depends_on:
      flowstock:
        condition: service_healthy
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD", "dotnet", "FlowStock.DiscoveryRelay.dll", "healthcheck"]
      interval: 10s
      timeout: 12s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      discovery-relay:
        condition: service_healthy
      flowstock:
        condition: service_healthy
    ports:
      - "${FLOWSTOCK_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/flowstock.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  pgbackup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_PREFIX: FlowStock
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - pgbackups:/backups
      - ./backup/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
    command: ["sh", "/usr/local/bin/pg_backup.sh"]
    restart: unless-stopped

volumes:
  pgdata:
  pgbackups:
