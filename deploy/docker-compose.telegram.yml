services:
  flowstock:
    environment:
      FLOWSTOCK_TELEGRAM_ENABLED: ${FLOWSTOCK_TELEGRAM_ENABLED:-0}
      FLOWSTOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/flowstock_telegram_bot_token
      FLOWSTOCK_TELEGRAM_CHAT_ID: ${FLOWSTOCK_TELEGRAM_CHAT_ID:-}
      FLOWSTOCK_TELEGRAM_PROXY_URL: ${FLOWSTOCK_TELEGRAM_PROXY_URL:-socks5://tailscale-egress:1055}
    secrets:
      - source: flowstock_telegram_bot_token
        target: flowstock_telegram_bot_token
    networks:
      - default
      - telegram-egress

secrets:
  flowstock_telegram_bot_token:
    file: ${FLOWSTOCK_TELEGRAM_BOT_TOKEN_SECRET_FILE:?FLOWSTOCK_TELEGRAM_BOT_TOKEN_SECRET_FILE is required}

networks:
  default:
  telegram-egress:
    external: true
    name: ${FLOWSTOCK_TELEGRAM_EGRESS_NETWORK:-reg-ru-imap-telegram_default}
