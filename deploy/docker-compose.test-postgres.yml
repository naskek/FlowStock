services:
  postgres-test:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${FLOWSTOCK_TEST_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: flowstock_test
      POSTGRES_USER: flowstock_test
      POSTGRES_PASSWORD: flowstock_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrator-test:
    image: postgres:16-alpine
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      PGHOST: postgres-test
      PGPORT: 5432
      PGDATABASE: flowstock_test
      PGUSER: flowstock_test
      PGPASSWORD: flowstock_test
      MIGRATIONS_DIR: /migrations
      POSTGRES_WAIT_TIMEOUT_SECONDS: 120
    volumes:
      - ./postgres/migrations:/migrations:ro
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/run_migrations.sh"]
    restart: "no"
