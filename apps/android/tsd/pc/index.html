<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowStock · ПК</title>
    <meta name="theme-color" content="#14324b" />
    <meta name="flowstock-pc-web-version" content="__FLOWSTOCK_PC_WEB_VERSION__" />
    <link rel="icon" href="./assets/fs_favicon.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css?v=__FLOWSTOCK_PC_WEB_VERSION__" />
  </head>
  <body class="pc-body needs-login">
    <header class="pc-header">
      <div class="pc-brand">
        <img class="pc-logo" src="./assets/FS_logo.png" alt="FlowStock" />
      </div>
      <div class="pc-account">
        <div class="pc-account-chip">
          <span id="accountInitial" class="pc-account-avatar" aria-hidden="true">Г</span>
          <span id="accountLabel" class="pc-account-label">Гость</span>
        </div>
        <button id="logoutBtn" class="btn btn-outline pc-logout" type="button">Выйти</button>
      </div>
    </header>
    <nav class="pc-subnav">
      <div class="pc-tabs">
        <button class="pc-tab is-active" data-view="orders">Заказы</button>
        <button class="pc-tab" data-view="stock">Состояние склада</button>
        <button class="pc-tab" data-view="production-need">Потребность производства</button>
        <button class="pc-tab" data-view="catalog">Каталог</button>
        <button class="pc-tab" data-view="warehouse-board">Задания склада</button>
      </div>
    </nav>
    <main id="app" class="pc-content"></main>
    <aside id="pcVersionBanner" class="pc-version-banner" role="status" hidden>
      <span>Доступна новая версия FlowStock</span>
      <button id="pcVersionReloadBtn" class="btn btn-outline" type="button">Обновить</button>
    </aside>
    <script src="../compat.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./pc-core.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./pc-auth.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./pc-order-modal.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./pc-catalog.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./pc-stock.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./warehouse-board.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
    <script src="./app.js?v=__FLOWSTOCK_PC_WEB_VERSION__"></script>
  </body>
</html>
